<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo con gradiente -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo redondeado -->
  <rect width="32" height="32" rx="8" fill="url(#bgGradient)"/>
  
  <!-- Efecto de brillo sutil -->
  <rect width="32" height="16" rx="8" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Elementos de Pong -->
  <!-- Paleta izquierda -->
  <rect x="4" y="10" width="2" height="12" rx="1" fill="white" opacity="0.9"/>
  
  <!-- Paleta derecha -->
  <rect x="26" y="10" width="2" height="12" rx="1" fill="white" opacity="0.9"/>
  
  <!-- Pelota (círculo) -->
  <circle cx="16" cy="16" r="2" fill="url(#textGradient)"/>
  
  <!-- Línea central punteada -->
  <line x1="16" y1="6" x2="16" y2="10" stroke="white" stroke-width="1" opacity="0.6"/>
  <line x1="16" y1="14" x2="16" y2="18" stroke="white" stroke-width="1" opacity="0.6"/>
  <line x1="16" y1="22" x2="16" y2="26" stroke="white" stroke-width="1" opacity="0.6"/>
  
  <!-- Texto "42" pequeño en la esquina -->
  <text x="25" y="8" text-anchor="middle" fill="white" font-family="monospace" font-size="4" font-weight="bold" opacity="0.8">42</text>
</svg>